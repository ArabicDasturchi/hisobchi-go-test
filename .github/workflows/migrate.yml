# Supabase migratsiyalarini production bazaga avtomatik qo'llash.
# To'liq tavsif va asoschi qadamlari: docs/MIGRATSIYA-CI.md
#
#   main ga push (faqat supabase/migrations/** o'zgarsa)  → test → reja → (xavfli bo'lsa tasdiq) → qo'llash
#   qo'lda (workflow_dispatch) mode=migrate                → xuddi shunday
#   qo'lda (workflow_dispatch) mode=baseline               → 001-004 ni "qo'llangan" deb belgilash (bir marta)
#
# Sirlar faqat GitHub Secrets'da: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD. service_role ishlatilmaydi.
name: Migratsiya (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "migrate = yangi migratsiyalarni qo'llash; baseline = 001-004 ni 'qo'llangan' deb belgilash (bir marta)"
        type: choice
        options: [migrate, baseline]
        default: migrate
      confirm:
        description: "Faqat baseline uchun: loyiha ref'ini aynan yozing (kfrnlkwocwpezwgytcmz)"
        type: string
        required: false

# Bir vaqtda faqat bitta migratsiya ishi. Navbatdagi ish oldingisini bekor qilmaydi (qo'llanayotgan migratsiya
# o'rtasida to'xtatilmasin). Navbatda faqat bitta ish kutadi: keyingisi hamma kutilayotgan migratsiyani qo'llaydi.
concurrency:
  group: supabase-migrate-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Loyiha ref'i sir emas (hujjatlarda ochiq turadi)
  SUPABASE_PROJECT_REF: kfrnlkwocwpezwgytcmz
  SUPABASE_CLI_VERSION: '3.0.0'

jobs:
  # 1) Testlar yashil bo'lmasa migratsiya qo'llanmaydi
  test:
    name: Testlar
    if: github.event_name == 'push' || inputs.mode == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # supabase/tests/run_local.sh uchun (lokal PostgreSQL, Supabase stub)
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migratsiyalar va xavfsizlik SQL testlari (lokal PostgreSQL)
        run: |
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          bash supabase/tests/run_local.sh

  # 2) Reja: qaysi migratsiyalar kutilmoqda, xavfli buyruq bormi (hech narsa o'zgarmaydi)
  plan:
    name: Reja
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      pending: ${{ steps.guard.outputs.pending }}
      pending_count: ${{ steps.guard.outputs.pending_count }}
      dangerous: ${{ steps.guard.outputs.dangerous }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Sirlar mavjudligini tekshirish (qiymatlar chop etilmaydi)
        run: |
          missing=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secrets'da $n yo'q. docs/MIGRATSIYA-CI.md ga qarang."; missing=1; fi
          done
          exit $missing
      - name: Loyihaga ulanish
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Bazadagi migratsiya tarixi
        run: supabase migration list --remote
      - name: Zaxira holati (ma'lumot uchun; topilmasa ham davom etadi)
        continue-on-error: true
        run: supabase backups list --remote
      - name: Kutilayotgan migratsiyalar (dry-run)
        run: |
          set -o pipefail
          supabase db push --dry-run --remote 2>&1 | tee dry-run.txt
      - name: Qo'riqchi (001-004 qayta qo'llanmasin; xavfli buyruqlar)
        id: guard
        run: node scripts/ci/migration-guard.mjs plan --dry-run-file dry-run.txt

  # 3) Qo'llash. Xavfli buyruq bo'lsa `production-approval` muhiti (Required reviewers) tasdiqni kutadi.
  apply:
    name: Qo'llash
    needs: [test, plan]
    if: needs.plan.outputs.pending_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.dangerous == 'true' && 'production-approval' || 'production' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PLAN_PENDING: ${{ needs.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Sirlar mavjudligini tekshirish (qiymatlar chop etilmaydi)
        run: |
          missing=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secrets'da $n yo'q."; missing=1; fi
          done
          exit $missing
      - name: Loyihaga ulanish
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Tasdiq va qo'llash orasida reja o'zgarmaganini tekshirish
        run: |
          set -o pipefail
          supabase db push --dry-run --remote 2>&1 | tee dry-run.txt
          node scripts/ci/migration-guard.mjs apply --dry-run-file dry-run.txt --expect "$PLAN_PENDING"
      - name: Migratsiyalarni qo'llash (har fayl bitta tranzaksiyada; xatoda shu fayl qo'llanmaydi va ish to'xtaydi)
        run: supabase db push --remote --yes
      - name: Tekshiruv - kutilayotgan migratsiya qolmaganini
        run: |
          set -o pipefail
          supabase db push --dry-run --remote 2>&1 | tee dry-run-after.txt
          node scripts/ci/migration-guard.mjs apply --dry-run-file dry-run-after.txt --expect ""
          supabase migration list --remote

  # Bir martalik: qo'lda (SQL Editor) qo'llangan 001-004 ni migratsiya tarixiga "qo'llangan" deb yozadi.
  # Migratsiyalarning o'zi QAYTA ISHGA TUSHMAYDI. Faqat qo'lda va tasdiq bilan.
  baseline:
    name: Baseline (001-004)
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-approval
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Tasdiq matni loyiha ref'iga teng ekanini tekshirish
        run: |
          if [ "$CONFIRM" != "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::confirm maydoniga loyiha ref'ini aynan yozing ($SUPABASE_PROJECT_REF)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Sirlar mavjudligini tekshirish (qiymatlar chop etilmaydi)
        run: |
          missing=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!n}" ]; then echo "::error::GitHub Secrets'da $n yo'q."; missing=1; fi
          done
          exit $missing
      - name: Loyihaga ulanish
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Bazadagi migratsiya tarixi (oldin)
        run: |
          set -o pipefail
          supabase migration list --remote 2>&1 | tee list-before.txt
      - name: Tarixda yo'q 001-004 ni aniqlash
        id: which
        run: node scripts/ci/migration-guard.mjs baseline --list-file list-before.txt
      - name: "'Qo'llangan' deb belgilash (SQL bajarilmaydi, faqat tarix yoziladi)"
        if: steps.which.outputs.count != '0'
        env:
          VERSIONS: ${{ steps.which.outputs.versions }}
        run: |
          # VERSIONS faqat raqamli versiyalar (qo'riqchi skript chiqaradi); so'zlarga bo'linishi ataylab
          supabase migration repair --status applied $VERSIONS --remote --yes
      - name: Tekshiruv - 001-004 endi kutilayotgan emas
        run: |
          set -o pipefail
          supabase migration list --remote
          supabase db push --dry-run --remote 2>&1 | tee dry-run-after.txt
          node scripts/ci/migration-guard.mjs plan --dry-run-file dry-run-after.txt
